<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>ADHD Planner 2026-2027</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f6f1ea;
      --paper: #fffdfb;
      --paper-alt: #f8f3ee;
      --ink: #2d2a29;
      --muted: #7b7069;
      --line: #e7ded6;
      --rose: #f8dfe3;
      --rose-deep: #d98e9a;
      --lavender: #e8deef;
      --lavender-deep: #9a7ec1;
      --sage: #dfeee7;
      --sage-deep: #7ca88f;
      --peach: #fbe7dc;
      --peach-deep: #d69e7a;
      --sky: #e1ecf8;
      --sky-deep: #698fc2;
      --shadow: rgba(58, 49, 42, 0.08);
      --shadow-strong: rgba(58, 49, 42, 0.12);
      --success: #6ca184;
      --danger: #bf7d7d;
      --warning: #e6c673;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'Quicksand', sans-serif;
      padding: 18px;
      display: flex;
      justify-content: center;
    }

    .planner-shell {
      width: 100%;
      max-width: 1400px;
      background: rgba(255,255,255,0.55);
      border: 1px solid var(--line);
      border-radius: 28px;
      box-shadow: 0 18px 40px rgba(87, 69, 58, .06);
      padding: 24px;
      backdrop-filter: blur(12px);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      border-bottom: 2px dashed var(--line);
      padding-bottom: 14px;
      margin-bottom: 20px;
    }

    .title-block {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .eyebrow {
      font-size: 0.72rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--muted);
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.1rem, 2.5vw, 3.2rem);
      letter-spacing: -.04em;
      color: var(--ink);
      line-height: .95;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .segmented {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--paper-alt);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 6px;
    }

    .segment {
      background: transparent;
      border: none;
      border-radius: 999px;
      padding: 8px 15px;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--muted);
      cursor: pointer;
      transition: all .2s ease;
    }

    .segment.active {
      background: var(--paper);
      box-shadow: 0 4px 12px var(--shadow);
      color: var(--ink);
    }

    .pill {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--paper-alt);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--muted);
    }

    .pill button {
      border: none;
      background: transparent;
      font-size: 1rem;
      cursor: pointer;
      color: var(--ink);
      padding: 2px 6px;
    }

    .view {
      display: none;
    }

    .view.active {
      display: block;
    }

    .year-legend {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin: 8px 0 18px;
      font-size: 0.8rem;
      color: var(--muted);
      font-weight: 700;
    }

    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
    }

    .year-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 16px;
    }

    .month-card {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 12px 18px var(--shadow);
    }

    .month-header {
      padding: 12px 14px;
      font-size: 0.8rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      font-weight: 800;
      text-align: center;
      border-bottom: 1px solid rgba(0,0,0,.04);
    }

    .month-header.nov { background: var(--rose); color: #83555d; }
    .month-header.dec { background: var(--sky); color: #46678f; }
    .month-header.jan { background: var(--lavender); color: #7e5ba4; }
    .month-header.feb { background: var(--rose); color: #83555d; }
    .month-header.mar { background: var(--sage); color: #446d60; }
    .month-header.apr { background: var(--peach); color: #b87b5b; }
    .month-header.may { background: var(--lavender); color: #7e5ba4; }
    .month-header.jun { background: var(--sky); color: #46678f; }
    .month-header.jul { background: var(--rose); color: #83555d; }
    .month-header.aug { background: var(--sage); color: #446d60; }
    .month-header.sep { background: var(--peach); color: #b87b5b; }
    .month-header.oct { background: var(--lavender); color: #7e5ba4; }

    .month-days {
      padding: 8px;
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
    }

    .mini-day {
      aspect-ratio: 1;
      border-radius: 8px;
      background: var(--paper-alt);
      border: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.65rem;
      font-weight: 700;
      cursor: pointer;
      transition: all .15s ease;
      position: relative;
      color: var(--ink);
    }

    .mini-day:hover {
      background: var(--sky);
      border-color: var(--sky-deep);
    }

    .mini-day.other-month {
      opacity: 0.35;
      cursor: default;
    }

    .mini-day.has-event::after {
      content: '';
      position: absolute;
      width: 6px;
      height: 6px;
      background: var(--rose-deep);
      border-radius: 50%;
      bottom: 3px;
      left: 50%;
      transform: translateX(-50%);
    }

    .daily-container {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      max-width: 900px;
      margin: 0 auto;
    }

    .daily-date-picker {
      flex: 1;
      min-width: 280px;
    }

    .card {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: 0 12px 18px var(--shadow);
      overflow: hidden;
      flex: 1;
      min-width: 280px;
    }

    .card-header {
      padding: 14px 16px;
      font-size: 0.8rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      font-weight: 800;
      border-bottom: 1px solid var(--line);
      background: var(--sky);
      color: #46678f;
    }

    .card-header.rose { background: var(--rose); color: #83555d; }
    .card-header.lavender { background: var(--lavender); color: #7e5ba4; }
    .card-header.sage { background: var(--sage); color: #446d60; }
    .card-header.peach { background: var(--peach); color: #b87b5b; }
    .card-header.sky { background: var(--sky); color: #46678f; }

    .card-body {
      padding: 16px;
    }

    .todo-form {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      margin-bottom: 14px;
    }

    .todo-form input {
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--paper-alt);
      font-family: inherit;
      font-size: 0.9rem;
      color: var(--ink);
    }

    .todo-form input::placeholder {
      color: var(--muted);
    }

    .event-form {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 14px;
    }

    .event-form input,
    .event-form select {
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--paper-alt);
      font-family: inherit;
      font-size: 0.9rem;
      color: var(--ink);
    }

    .event-form input::placeholder {
      color: var(--muted);
    }

    .event-controls {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 8px;
    }

    .btn, .event-btn {
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--paper-alt);
      padding: 10px 12px;
      font-family: inherit;
      font-weight: 700;
      color: var(--ink);
      cursor: pointer;
      transition: all .15s ease;
      font-size: 0.85rem;
    }

    .btn:hover, .event-btn:hover {
      background: var(--sky);
      border-color: var(--sky-deep);
    }

    .todo-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .todo-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: var(--paper-alt);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
    }

    .todo-text {
      flex: 1;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .todo-text.done {
      text-decoration: line-through;
      color: var(--muted);
    }

    .todo-checkbox {
      width: 20px;
      height: 20px;
      cursor: pointer;
    }

    .remove-btn {
      background: transparent;
      border: none;
      color: var(--danger);
      cursor: pointer;
      font-size: 1rem;
      padding: 2px 4px;
    }

    .event-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .event-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: var(--paper-alt);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 8px 10px;
    }

    .event-main {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      flex: 1;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 62px;
      padding: 5px 8px;
      border-radius: 999px;
      font-size: 0.62rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 800;
      background: var(--sky);
      color: #46678f;
      flex-shrink: 0;
    }

    .tag.appointment { background: var(--sky); color: #46678f; }
    .tag.birthday { background: var(--rose); color: #83555d; }
    .tag.event { background: var(--sage); color: #446d60; }

    .event-text {
      font-size: 0.86rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .remove-event {
      background: transparent;
      border: none;
      color: var(--danger);
      cursor: pointer;
      font-size: 1rem;
      line-height: 1;
      padding: 2px 4px;
      flex-shrink: 0;
    }

    .empty-state {
      padding: 10px 0;
      color: var(--muted);
      font-size: 0.9rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="planner-shell">
    <div class="topbar">
      <div class="title-block">
        <div class="eyebrow">2026–2027</div>
        <h1>ADHD Planner</h1>
      </div>
      <div class="header-actions">
        <div class="segmented">
          <button class="segment active" data-view="year">Year</button>
          <button class="segment" data-view="daily">Daily</button>
        </div>
      </div>
    </div>

    <!-- Year View -->
    <div id="year-view" class="view active">
      <div class="year-legend">
        <span><span class="legend-dot" style="background: var(--rose);"></span> Birthdays</span>
        <span><span class="legend-dot" style="background: var(--sky);"></span> Appointments</span>
        <span><span class="legend-dot" style="background: var(--sage);"></span> Events</span>
      </div>
      <div class="year-grid" id="year-grid"></div>
    </div>

    <!-- Daily View -->
    <div id="daily-view" class="view">
      <div class="daily-container">
        <!-- Date Picker -->
        <div class="daily-date-picker">
          <div class="card">
            <div class="card-header">Select Date</div>
            <div class="card-body">
              <div id="date-picker-mini" class="month-card">
                <div class="month-header" id="picker-month-name"></div>
                <div class="month-days" id="picker-days"></div>
              </div>
              <div style="margin-top: 14px;">
                <button class="btn" id="today-btn" style="width: 100%;">Today</button>
              </div>
            </div>
          </div>
        </div>

        <!-- Daily Content -->
        <div>
          <div class="card" style="margin-bottom: 20px;">
            <div class="card-header sky" id="current-date-header">December 9, 2026</div>
            <div class="card-body">
              <div class="todo-form">
                <input id="todo-input" type="text" placeholder="Add a task..." />
                <button class="btn" id="add-todo-btn">Add</button>
              </div>
              <div class="todo-list" id="todo-list"></div>
            </div>
          </div>

          <div class="card">
            <div class="card-header sky">Appointments & Events</div>
            <div class="card-body">
              <div class="event-form">
                <input id="eventTitle" type="text" placeholder="Add appointment, birthday, or event" />
                <div class="event-controls">
                  <select id="eventType">
                    <option value="appointment">Appointment</option>
                    <option value="birthday">Birthday</option>
                    <option value="event">Event</option>
                  </select>
                  <button class="event-btn" id="addEventBtn" type="button">Save</button>
                </div>
              </div>
              <div id="eventList" class="event-list"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let currentDate = new Date();

    const TODOS_KEY = 'adhd_planner_todos_v1';
    const EVENTS_KEY = 'adhd_planner_events_v1';

    // ===== EVENTS LOGIC =====
    function formatDateKey(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function getEvents() {
      try {
        return JSON.parse(localStorage.getItem(EVENTS_KEY) || '{}');
      } catch {
        return {};
      }
    }

    function saveEvents(events) {
      localStorage.setItem(EVENTS_KEY, JSON.stringify(events));
    }

    function addEvent() {
      const titleInput = document.getElementById('eventTitle');
      const typeSelect = document.getElementById('eventType');
      const title = titleInput.value.trim();
      if (!title) return;

      const events = getEvents();
      const key = formatDateKey(currentDate);
      const list = events[key] || [];
      list.push({
        id: `${Date.now()}-${Math.random().toString(16).slice(2)}`,
        title,
        type: typeSelect.value
      });
      events[key] = list;
      saveEvents(events);

      titleInput.value = '';
      renderEventList();
      renderYearOverview();
    }

    function renderEventList() {
      const listEl = document.getElementById('eventList');
      const key = formatDateKey(currentDate);
      const events = getEvents()[key] || [];
      listEl.innerHTML = '';

      if (events.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'empty-state';
        empty.textContent = 'No appointments or events saved for this date.';
        listEl.appendChild(empty);
        return;
      }

      events.forEach(event => {
        const item = document.createElement('div');
        item.className = 'event-item';

        const main = document.createElement('div');
        main.className = 'event-main';

        const tag = document.createElement('span');
        tag.className = `tag ${event.type}`;
        tag.textContent = event.type;

        const text = document.createElement('div');
        text.className = 'event-text';
        text.textContent = event.title;

        main.appendChild(tag);
        main.appendChild(text);

        const removeBtn = document.createElement('button');
        removeBtn.className = 'remove-event';
        removeBtn.textContent = '×';
        removeBtn.setAttribute('aria-label', 'Remove event');
        removeBtn.addEventListener('click', () => {
          const current = getEvents();
          current[key] = (current[key] || []).filter(e => e.id !== event.id);
          if (current[key].length === 0) delete current[key];
          saveEvents(current);
          renderEventList();
          renderYearOverview();
        });

        item.appendChild(main);
        item.appendChild(removeBtn);
        listEl.appendChild(item);
      });
    }

    // ===== TODOS LOGIC =====
    function getTodos() {
      try {
        return JSON.parse(localStorage.getItem(TODOS_KEY) || '{}');
      } catch {
        return {};
      }
    }

    function saveTodos(todos) {
      localStorage.setItem(TODOS_KEY, JSON.stringify(todos));
    }

    function addTodo() {
      const input = document.getElementById('todo-input');
      const text = input.value.trim();
      if (!text) return;

      const todos = getTodos();
      const key = formatDateKey(currentDate);
      const list = todos[key] || [];
      list.push({
        id: `${Date.now()}-${Math.random().toString(16).slice(2)}`,
        text,
        done: false
      });
      todos[key] = list;
      saveTodos(todos);

      input.value = '';
      renderTodoList();
    }

    function renderTodoList() {
      const listEl = document.getElementById('todo-list');
      const key = formatDateKey(currentDate);
      const todos = getTodos()[key] || [];
      listEl.innerHTML = '';

      if (todos.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'empty-state';
        empty.textContent = 'No tasks added yet.';
        listEl.appendChild(empty);
        return;
      }

      todos.forEach(todo => {
        const item = document.createElement('div');
        item.className = 'todo-item';

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.className = 'todo-checkbox';
        checkbox.checked = todo.done;
        checkbox.addEventListener('change', () => {
          const current = getTodos();
          const t = current[key].find(x => x.id === todo.id);
          if (t) t.done = !t.done;
          saveTodos(current);
          renderTodoList();
        });

        const text = document.createElement('div');
        text.className = `todo-text ${todo.done ? 'done' : ''}`;
        text.textContent = todo.text;

        const removeBtn = document.createElement('button');
        removeBtn.className = 'remove-btn';
        removeBtn.textContent = '×';
        removeBtn.addEventListener('click', () => {
          const current = getTodos();
          current[key] = current[key].filter(x => x.id !== todo.id);
          if (current[key].length === 0) delete current[key];
          saveTodos(current);
          renderTodoList();
        });

        item.appendChild(checkbox);
        item.appendChild(text);
        item.appendChild(removeBtn);
        listEl.appendChild(item);
      });
    }

    // ===== DATE & CALENDAR LOGIC =====
    function updateDateDisplay() {
      const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
      const dateStr = currentDate.toLocaleDateString('en-US', options);
      document.getElementById('current-date-header').textContent = dateStr;
    }

    function renderYearOverview() {
      const grid = document.getElementById('year-grid');
      grid.innerHTML = '';

      const allEvents = getEvents();

      for (let m = 10; m < 12; m++) {
        const date = new Date(2026, m, 1);
        renderMonth(date, grid, allEvents);
      }
      for (let m = 0; m < 10; m++) {
        const date = new Date(2027, m, 1);
        renderMonth(date, grid, allEvents);
      }
    }

    function renderMonth(date, container, allEvents) {
      const card = document.createElement('div');
      card.className = 'month-card';

      const monthNames = ['jan', 'feb', 'mar', 'apr', 'may', 'jun', 'jul', 'aug', 'sep', 'oct', 'nov', 'dec'];
      const monthName = monthNames[date.getMonth()];
      const header = document.createElement('div');
      header.className = `month-header ${monthName}`;
      header.textContent = date.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
      card.appendChild(header);

      const daysContainer = document.createElement('div');
      daysContainer.className = 'month-days';

      const firstDay = new Date(date.getFullYear(), date.getMonth(), 1);
      const lastDay = new Date(date.getFullYear(), date.getMonth() + 1, 0);
      const startDate = new Date(firstDay);
      startDate.setDate(startDate.getDate() - firstDay.getDay());

      for (let i = 0; i < 42; i++) {
        const cellDate = new Date(startDate);
        cellDate.setDate(cellDate.getDate() + i);

        const dayCell = document.createElement('div');
        dayCell.className = 'mini-day';

        if (cellDate.getMonth() !== date.getMonth()) {
          dayCell.classList.add('other-month');
        } else {
          dayCell.style.cursor = 'pointer';
          dayCell.addEventListener('click', () => {
            currentDate = new Date(cellDate);
            updateDateDisplay();
            renderTodoList();
            renderEventList();
            switchView('daily');
          });
        }

        const dateKey = formatDateKey(cellDate);
        if (allEvents[dateKey] && allEvents[dateKey].length) {
          dayCell.classList.add('has-event');
        }

        dayCell.textContent = cellDate.getDate();
        daysContainer.appendChild(dayCell);
      }

      card.appendChild(daysContainer);
      container.appendChild(card);
    }

    function renderDatePickerMini() {
      const date = currentDate;
      const monthNames = ['jan', 'feb', 'mar', 'apr', 'may', 'jun', 'jul', 'aug', 'sep', 'oct', 'nov', 'dec'];
      const monthName = monthNames[date.getMonth()];

      document.getElementById('picker-month-name').textContent = date.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
      document.getElementById('picker-month-name').className = `month-header ${monthName}`;

      const daysContainer = document.getElementById('picker-days');
      daysContainer.innerHTML = '';

      const firstDay = new Date(date.getFullYear(), date.getMonth(), 1);
      const lastDay = new Date(date.getFullYear(), date.getMonth() + 1, 0);
      const startDate = new Date(firstDay);
      startDate.setDate(startDate.getDate() - firstDay.getDay());

      for (let i = 0; i < 42; i++) {
        const cellDate = new Date(startDate);
        cellDate.setDate(cellDate.getDate() + i);

        const dayCell = document.createElement('div');
        dayCell.className = 'mini-day';

        if (cellDate.getMonth() !== date.getMonth()) {
          dayCell.classList.add('other-month');
        } else {
          dayCell.style.cursor = 'pointer';
          dayCell.addEventListener('click', () => {
            currentDate = new Date(cellDate);
            updateDateDisplay();
            renderTodoList();
            renderEventList();
            renderDatePickerMini();
          });
        }

        const dateKey = formatDateKey(cellDate);
        const allEvents = getEvents();
        if (allEvents[dateKey] && allEvents[dateKey].length) {
          dayCell.classList.add('has-event');
        }

        dayCell.textContent = cellDate.getDate();
        daysContainer.appendChild(dayCell);
      }
    }

    // ===== VIEW SWITCHING =====
    function switchView(viewName) {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.getElementById(`${viewName}-view`).classList.add('active');

      document.querySelectorAll('.segment').forEach(s => s.classList.remove('active'));
      document.querySelector(`[data-view="${viewName}"]`).classList.add('active');
    }

    // ===== EVENT LISTENERS =====
    document.querySelectorAll('[data-view]').forEach(btn => {
      btn.addEventListener('click', () => switchView(btn.dataset.view));
    });

    document.getElementById('add-todo-btn').addEventListener('click', addTodo);
    document.getElementById('todo-input').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') addTodo();
    });

    document.getElementById('addEventBtn').addEventListener('click', addEvent);
    document.getElementById('eventTitle').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') addEvent();
    });

    document.getElementById('today-btn').addEventListener('click', () => {
      currentDate = new Date();
      updateDateDisplay();
      renderTodoList();
      renderEventList();
      renderDatePickerMini();
    });

    // ===== INIT =====
    function init() {
      updateDateDisplay();
      renderYearOverview();
      renderTodoList();
      renderEventList();
      renderDatePickerMini();
    }

    init();
  </script>
</body>
</html>
