<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>ADHD Planner 2026-2027</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f6f1ea;
      --paper: #fffdfb;
      --paper-alt: #f8f3ee;
      --ink: #2d2a29;
      --muted: #7b7069;
      --line: #e7ded6;
      --rose: #f8dfe3;
      --rose-deep: #d98e9a;
      --lavender: #e8deef;
      --lavender-deep: #9a7ec1;
      --sage: #dfeee7;
      --sage-deep: #7ca88f;
      --peach: #fbe7dc;
      --peach-deep: #d69e7a;
      --sky: #e1ecf8;
      --sky-deep: #698fc2;
      --shadow: rgba(58, 49, 42, 0.08);
      --shadow-strong: rgba(58, 49, 42, 0.12);
      --success: #6ca184;
      --danger: #bf7d7d;
      --warning: #e6c673;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'Quicksand', sans-serif;
      padding: 18px;
      display: flex;
      justify-content: center;
    }

    .planner-shell {
      width: 100%;
      max-width: 1400px;
      background: rgba(255,255,255,0.55);
      border: 1px solid var(--line);
      border-radius: 28px;
      box-shadow: 0 18px 40px rgba(87, 69, 58, .06);
      padding: 24px;
      backdrop-filter: blur(12px);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      border-bottom: 2px dashed var(--line);
      padding-bottom: 14px;
      margin-bottom: 20px;
    }

    .title-block {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .eyebrow {
      font-size: 0.72rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--muted);
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.1rem, 2.5vw, 3.2rem);
      letter-spacing: -.04em;
      color: var(--ink);
      line-height: .95;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .segmented {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--paper-alt);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 6px;
    }

    .segment {
      background: transparent;
      border: none;
      border-radius: 999px;
      padding: 8px 15px;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--muted);
      cursor: pointer;
      transition: all .2s ease;
    }

    .segment.active {
      background: var(--paper);
      box-shadow: 0 4px 12px var(--shadow);
      color: var(--ink);
    }

    .pill {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--paper-alt);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--muted);
    }

    .pill button {
      border: none;
      background: transparent;
      font-size: 1rem;
      cursor: pointer;
      color: var(--ink);
      padding: 2px 6px;
    }

    .view {
      display: none;
    }

    .view.active {
      display: block;
    }

    .year-legend {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin: 8px 0 18px;
      font-size: 0.8rem;
      color: var(--muted);
      font-weight: 700;
    }

    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
    }

    .year-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 16px;
    }

    .month-card {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 12px 18px var(--shadow);
    }

    .month-header {
      padding: 12px 14px;
      font-size: 0.8rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      font-weight: 800;
      text-align: center;
      border-bottom: 1px solid rgba(0,0,0,.04);
    }

    .month-header.nov { background: var(--rose); color: #83555d; }
    .month-header.dec { background: var(--sky); color: #46678f; }
    .month-header.jan { background: var(--lavender); color: #655383; }
    .month-header.feb { background: var(--peach); color: #8b624f; }
    .month-header.mar { background: var(--sage); color: #446d60; }
    .month-header.apr { background: var(--rose); color: #83555d; }
    .month-header.may { background: var(--lavender); color: #655383; }
    .month-header.jun { background: var(--peach); color: #8b624f; }
    .month-header.jul { background: var(--sage); color: #446d60; }
    .month-header.aug { background: var(--rose); color: #83555d; }
    .month-header.sep { background: var(--sky); color: #46678f; }
    .month-header.oct { background: var(--lavender); color: #655383; }

    .mini-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 4px;
      padding: 10px 10px 14px;
    }

    .mini-head {
      font-size: 0.62rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-align: center;
      font-weight: 700;
      color: var(--muted);
      padding: 4px 0 6px;
    }

    .mini-day {
      position: relative;
      aspect-ratio: 1;
      border-radius: 8px;
      display: flex;
      font-size: 0.73rem;
      font-weight: 700;
      align-items: center;
      justify-content: center;
      background: var(--paper-alt);
      color: var(--ink);
      border: 1px solid transparent;
      cursor: pointer;
      transition: all .18s ease;
    }

    .mini-day:hover {
      border-color: rgba(155,126,182,.45);
      transform: translateY(-1px);
    }

    .mini-day.other-month {
      opacity: .35;
    }

    .mini-day.today {
      background: linear-gradient(135deg, var(--rose), var(--peach));
      box-shadow: inset 0 0 0 1px rgba(0,0,0,.05);
    }

    .mini-day.has-event::after {
      content: '';
      position: absolute;
      width: 6px;
      height: 6px;
      background: var(--rose-deep);
      border-radius: 50%;
      bottom: 3px;
      left: 50%;
      transform: translateX(-50%);
    }

    .daily-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .date-pill {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--paper-alt);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 8px 12px;
      font-weight: 700;
      color: var(--ink);
    }

    .date-pill button {
      background: transparent;
      border: none;
      cursor: pointer;
      color: var(--ink);
      font-size: 1rem;
      padding: 2px 6px;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .column {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 10px 18px var(--shadow);
    }

    .card-header {
      padding: 11px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.76rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 800;
    }

    .card-header.rose { background: var(--rose); color: #83555d; }
    .card-header.purple { background: var(--lavender); color: #655383; }
    .card-header.green { background: var(--sage); color: #446d60; }
    .card-header.peach { background: var(--peach); color: #8b624f; }
    .card-header.sky { background: var(--sky); color: #46678f; }

    .card-body {
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    textarea, input[type="text"], select {
      width: 100%;
      border: 1px solid transparent;
      background: var(--paper-alt);
      border-radius: 10px;
      padding: 10px 12px;
      color: var(--ink);
      outline: none;
      font: inherit;
      resize: vertical;
      transition: border-color .2s ease, box-shadow .2s ease;
    }

    textarea:focus, input[type="text"]:focus, select:focus {
      border-color: rgba(155,126,182,.5);
      box-shadow: 0 0 0 3px rgba(155,126,182,.08);
      background: #fff;
    }

    .task-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .checkbox {
      width: 22px;
      height: 22px;
      border-radius: 7px;
      border: 2px solid var(--lavender-deep);
      background: #fff;
      position: relative;
      cursor: pointer;
      flex-shrink: 0;
    }

    .checkbox.checked {
      background: var(--lavender-deep);
      border-color: var(--lavender-deep);
    }

    .checkbox.checked::after {
      content: '✓';
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-size: 13px;
      color: #fff;
      font-weight: 800;
    }

    .task-input {
      border: none;
      border-bottom: 1px dashed var(--line);
      background: transparent;
      border-radius: 0;
      padding: 5px 2px;
    }

    .task-input.completed {
      text-decoration: line-through;
      color: var(--muted);
    }

    .progress-wrap {
      width: 100%;
      height: 10px;
      border-radius: 999px;
      background: var(--paper-alt);
      overflow: hidden;
      border: 1px solid var(--line);
    }

    .progress-fill {
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, var(--sage-deep), var(--success));
      transition: width .25s ease;
    }

    .schedule-grid {
      display: grid;
      grid-template-columns: 52px 1fr;
      gap: 8px 8px;
      max-height: 450px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .time-slot {
      font-size: 0.76rem;
      font-weight: 700;
      color: var(--muted);
      align-self: center;
      text-align: right;
      padding-right: 4px;
    }

    .block-input {
      background: var(--paper-alt);
      border: 1px solid transparent;
      border-radius: 8px;
      padding: 7px 8px;
      font-size: 0.85rem;
      font-family: inherit;
      outline: none;
    }

    .block-input:focus {
      border-color: rgba(155,126,182,.5);
      box-shadow: 0 0 0 3px rgba(155,126,182,.08);
      background: #fff;
    }

    .event-form {
      display: grid;
      gap: 8px;
    }

    .event-controls {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 8px;
    }

    .event-btn {
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--paper-alt);
      padding: 10px 12px;
      font-family: inherit;
      font-weight: 700;
      color: var(--ink);
      cursor: pointer;
    }

    .event-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .event-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: var(--paper-alt);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 8px 10px;
    }

    .event-main {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      flex: 1;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 62px;
      padding: 5px 8px;
      border-radius: 999px;
      font-size: 0.62rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 800;
      background: var(--sky);
      color: #46678f;
    }

    .tag.appointment { background: var(--sky); color: #46678f; }
    .tag.birthday { background: var(--rose); color: #83555d; }
    .tag.event { background: var(--sage); color: #446d60; }

    .event-text {
      font-size: 0.86rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .remove-event {
      background: transparent;
      border: none;
      color: var(--danger);
      cursor: pointer;
      font-size: 1rem;
      line-height: 1;
      padding: 2px 4px;
    }

    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      padding-top: 14px;
    }

    .ghost-btn {
      border: none;
      background: transparent;
      cursor: pointer;
      color: var(--muted);
      text-decoration: underline;
      font-family: inherit;
      font-size: 0.8rem;
    }

    @media (max-width: 900px) {
      .dashboard-grid { grid-template-columns: 1fr; }
      .topbar { align-items: flex-start; }
      .header-actions { width: 100%; }
      .segmented { width: 100%; justify-content: center; }
      .daily-header { align-items: flex-start; }
      .event-controls { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="planner-shell">
    <div class="topbar">
      <div class="title-block">
        <div class="eyebrow">Executive planning system</div>
        <h1>ADHD Planner</h1>
      </div>

      <div class="header-actions">
        <div class="segmented">
          <button class="segment active" data-view="year">Year at a Glance</button>
          <button class="segment" data-view="daily">Daily</button>
        </div>
      </div>
    </div>

    <div id="year-view" class="view active">
      <div class="year-legend">
        <span><span class="legend-dot" style="background: var(--rose);"></span> focus</span>
        <span><span class="legend-dot" style="background: var(--sage);"></span> rhythm</span>
        <span><span class="legend-dot" style="background: var(--lavender);"></span> projects</span>
        <span><span class="legend-dot" style="background: var(--sky);"></span> events</span>
      </div>
      <div class="year-selector" style="display:flex; gap:10px; margin-bottom:18px; flex-wrap:wrap;">
        <button class="segment active" data-year="2026" style="background: var(--paper); box-shadow: 0 4px 12px rgba(58,49,42,.06);">2026</button>
        <button class="segment" data-year="2027">2027</button>
      </div>
      <div class="year-grid" id="yearGrid"></div>
    </div>

    <div id="daily-view" class="view">
      <div class="daily-header">
        <div class="date-pill">
          <button id="prevBtn">◀</button>
          <span id="dateDisplay">Today</span>
          <button id="nextBtn">▶</button>
        </div>

        <div class="pill">
          <span>Energy:</span>
          <button class="energy-btn" data-level="low" title="Low">🔋</button>
          <button class="energy-btn" data-level="med" title="Medium">⚡</button>
          <button class="energy-btn" data-level="high" title="High">✨</button>
        </div>
      </div>

      <div class="dashboard-grid">
        <div class="column">
          <div class="card">
            <div class="card-header rose">Big win</div>
            <div class="card-body">
              <textarea id="mainFocus" rows="2" placeholder="If I only accomplish one thing today..."></textarea>
            </div>
          </div>

          <div class="card">
            <div class="card-header purple">Essential 3</div>
            <div class="card-body">
              <div class="task-row">
                <div class="checkbox" data-id="top1"></div>
                <input type="text" class="task-input" id="top1-text" placeholder="Priority #1" />
              </div>
              <div class="task-row">
                <div class="checkbox" data-id="top2"></div>
                <input type="text" class="task-input" id="top2-text" placeholder="Priority #2" />
              </div>
              <div class="task-row">
                <div class="checkbox" data-id="top3"></div>
                <input type="text" class="task-input" id="top3-text" placeholder="Priority #3" />
              </div>
            </div>
          </div>

          <div class="card">
            <div class="card-header peach">Backlog</div>
            <div class="card-body">
              <div class="task-row">
                <div class="checkbox" data-id="extra1"></div>
                <input type="text" class="task-input" id="extra1-text" placeholder="If time allows..." />
              </div>
              <div class="task-row">
                <div class="checkbox" data-id="extra2"></div>
                <input type="text" class="task-input" id="extra2-text" placeholder="If time allows..." />
              </div>
              <div class="task-row">
                <div class="checkbox" data-id="extra3"></div>
                <input type="text" class="task-input" id="extra3-text" placeholder="If time allows..." />
              </div>
            </div>
          </div>
        </div>

        <div class="column">
          <div class="card" style="height: 100%;">
            <div class="card-header sky">Time blocks</div>
            <div class="card-body">
              <div class="schedule-grid" id="scheduleBlocks"></div>
            </div>
          </div>
        </div>

        <div class="column">
          <div class="card">
            <div class="card-header green">
              <span>Dopamine anchors</span>
              <span id="habitProgressText" style="font-size: 0.74rem; letter-spacing:0; text-transform:none;">0/4</span>
            </div>
            <div class="card-body">
              <div class="progress-wrap"><div class="progress-fill" id="habitProgressFill"></div></div>
              <div class="task-row">
                <div class="checkbox habit-check" data-id="water"></div>
                <span style="font-size:0.88rem;">Hydrate</span>
              </div>
              <div class="task-row">
                <div class="checkbox habit-check" data-id="movement"></div>
                <span style="font-size:0.88rem;">Walk / sunlight</span>
              </div>
              <div class="task-row">
                <div class="checkbox habit-check" data-id="meds"></div>
                <span style="font-size:0.88rem;">Meds</span>
              </div>
              <div class="task-row">
                <div class="checkbox habit-check" data-id="reset"></div>
                <span style="font-size:0.88rem;">Desk reset</span>
              </div>
            </div>
          </div>

          <div class="card" style="flex:1;">
            <div class="card-header purple">Brain dump</div>
            <div class="card-body">
              <textarea id="brainDump" rows="8" placeholder="List random thoughts, worries, appointments, errands..."></textarea>
            </div>
          </div>
        </div>
      </div>

      <div class="dashboard-grid" style="margin-top:20px;">
        <div class="column" style="grid-column: 1 / -1;">
          <div class="card">
            <div class="card-header sky">Appointments & events</div>
            <div class="card-body">
              <div class="event-form">
                <input id="eventTitle" type="text" placeholder="Add appointment, birthday, or event" />
                <div class="event-controls">
                  <select id="eventType">
                    <option value="appointment">Appointment</option>
                    <option value="birthday">Birthday</option>
                    <option value="event">Event</option>
                  </select>
                  <button class="event-btn" id="addEventBtn" type="button">Save event</button>
                  <button class="event-btn" id="loadTodayBtn" type="button" style="background: var(--paper);">Today</button>
                </div>
              </div>
              <div id="eventList" class="event-list"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="actions">
      <button class="ghost-btn" id="resetTodayBtn">Clear checks</button>
      <button class="ghost-btn" id="clearAllBtn" style="color: #b86969;">Reset</button>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'adhd_planner_2026_2027';
    const EVENTS_KEY = 'adhd_planner_events_v1';
    let currentDate = new Date(2026, 10, 1);
    let selectedYear = 2026;
    let currentView = 'year';

    const monthMeta = [
      { name: 'November', key: 'nov', year: 2026 },
      { name: 'December', key: 'dec', year: 2026 },
      { name: 'January', key: 'jan', year: 2027 },
      { name: 'February', key: 'feb', year: 2027 },
      { name: 'March', key: 'mar', year: 2027 },
      { name: 'April', key: 'apr', year: 2027 },
      { name: 'May', key: 'may', year: 2027 },
      { name: 'June', key: 'jun', year: 2027 },
      { name: 'July', key: 'jul', year: 2027 },
      { name: 'August', key: 'aug', year: 2027 },
      { name: 'September', key: 'sep', year: 2027 },
      { name: 'October', key: 'oct', year: 2027 },
      { name: 'November', key: 'nov', year: 2027 },
      { name: 'December', key: 'dec', year: 2027 }
    ];

    function formatDateKey(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function getEvents() {
      try { return JSON.parse(localStorage.getItem(EVENTS_KEY) || '{}'); }
      catch { return {}; }
    }

    function saveEvents(events) {
      localStorage.setItem(EVENTS_KEY, JSON.stringify(events));
    }

    function init() {
      renderYearOverview();
      renderDaily();
      bindEvents();
      loadState();
      renderEventList();
      updateDateDisplay();
      renderYearOverview();
    }

    function bindEvents() {
      document.querySelectorAll('.segment[data-view]').forEach(btn => {
        btn.addEventListener('click', () => {
          const view = btn.dataset.view;
          document.querySelectorAll('.segment[data-view]').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          document.getElementById('year-view').classList.toggle('active', view === 'year');
          document.getElementById('daily-view').classList.toggle('active', view === 'daily');
          currentView = view;
          if (view === 'daily') {
            updateDateDisplay();
            renderEventList();
          }
        });
      });

      document.querySelectorAll('.segment[data-year]').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.segment[data-year]').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          selectedYear = Number(btn.dataset.year);
          renderYearOverview();
        });
      });

      document.getElementById('prevBtn').addEventListener('click', () => {
        currentDate.setDate(currentDate.getDate() - 1);
        updateDateDisplay();
        renderEventList();
        loadState();
      });

      document.getElementById('nextBtn').addEventListener('click', () => {
        currentDate.setDate(currentDate.getDate() + 1);
        updateDateDisplay();
        renderEventList();
        loadState();
      });

      document.getElementById('addEventBtn').addEventListener('click', addEvent);
      document.getElementById('loadTodayBtn').addEventListener('click', () => {
        currentDate = new Date();
        updateDateDisplay();
        renderEventList();
        loadState();
      });

      document.querySelectorAll('.energy-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.energy-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          saveState();
        });
      });

      document.querySelectorAll('input[type="text"], textarea, select').forEach(el => {
        el.addEventListener('input', saveState);
        el.addEventListener('change', saveState);
      });

      document.querySelectorAll('.checkbox').forEach(box => {
        box.addEventListener('click', () => {
          const isChecked = box.classList.toggle('checked');
          const sibling = box.parentElement.querySelector('.task-input');
          if (sibling) sibling.classList.toggle('completed', isChecked);
          saveState();
          updateHabitProgress();
        });
      });

      document.getElementById('resetTodayBtn').addEventListener('click', () => {
        document.querySelectorAll('.checkbox').forEach(b => {
          b.classList.remove('checked');
          const sibling = b.parentElement.querySelector('.task-input');
          if (sibling) sibling.classList.remove('completed');
        });
        saveState();
        updateHabitProgress();
      });

      document.getElementById('clearAllBtn').addEventListener('click', () => {
        if (confirm('Clear planner data for this day?')) {
          localStorage.removeItem(getStorageKey());
          location.reload();
        }
      });
    }

    function addEvent() {
      const titleInput = document.getElementById('eventTitle');
      const typeSelect = document.getElementById('eventType');
      const title = titleInput.value.trim();
      if (!title) return;

      const events = getEvents();
      const key = formatDateKey(currentDate);
      const list = events[key] || [];
      list.push({
        id: `${Date.now()}-${Math.random().toString(16).slice(2)}`,
        title,
        type: typeSelect.value
      });
      events[key] = list;
      saveEvents(events);
      titleInput.value = '';
      renderEventList();
      renderYearOverview();
    }

    function renderEventList() {
      const listEl = document.getElementById('eventList');
      const key = formatDateKey(currentDate);
      const events = getEvents()[key] || [];
      listEl.innerHTML = '';

      if (events.length === 0) {
        const empty = document.createElement('div');
        empty.style.padding = '10px 0';
        empty.style.color = 'var(--muted)';
        empty.textContent = 'No appointments or events saved for this date.';
        listEl.appendChild(empty);
        return;
      }

      events.forEach(event => {
        const item = document.createElement('div');
        item.className = 'event-item';

        const main = document.createElement('div');
        main.className = 'event-main';

        const tag = document.createElement('span');
        tag.className = `tag ${event.type}`;
        tag.textContent = event.type;

        const text = document.createElement('div');
        text.className = 'event-text';
        text.textContent = event.title;

        main.appendChild(tag);
        main.appendChild(text);

        const removeBtn = document.createElement('button');
        removeBtn.className = 'remove-event';
        removeBtn.textContent = '×';
        removeBtn.setAttribute('aria-label', 'Remove event');
        removeBtn.addEventListener('click', () => {
          const current = getEvents();
          current[key] = (current[key] || []).filter(e => e.id !== event.id);
          if (current[key].length === 0) delete current[key];
          saveEvents(current);
          renderEventList();
          renderYearOverview();
        });

        item.appendChild(main);
        item.appendChild(removeBtn);
        listEl.appendChild(item);
      });
    }

    function renderYearOverview() {
      const grid = document.getElementById('yearGrid');
      grid.innerHTML = '';

      const months = monthMeta.filter(m => m.year === selectedYear);
      const allEvents = getEvents();

      months.forEach(month => {
        const monthCard = document.createElement('div');
        monthCard.className = 'month-card';

        const header = document.createElement('div');
        header.className = `month-header ${month.key}`;
        header.textContent = `${month.name} ${month.year}`;

        const miniGrid = document.createElement('div');
        miniGrid.className = 'mini-grid';

        ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].forEach(day => {
          const label = document.createElement('div');
          label.className = 'mini-head';
          label.textContent = day;
          miniGrid.appendChild(label);
        });

        const firstDay = new Date(month.year, new Date(`${month.name} 1, ${month.year}`).getMonth(), 1);
        const startDate = new Date(firstDay);
        startDate.setDate(startDate.getDate() - firstDay.getDay());

        let date = new Date(startDate);
        for (let i = 0; i < 42; i++) {
          const cell = document.createElement('button');
          cell.type = 'button';
          cell.className = 'mini-day';
          if (date.getMonth() !== firstDay.getMonth()) cell.classList.add('other-month');
          if (date.toDateString() === new Date().toDateString()) cell.classList.add('today');
          if (allEvents[formatDateKey(date)] && allEvents[formatDateKey(date)].length) cell.classList.add('has-event');
          cell.textContent = date.getDate();
          cell.addEventListener('click', () => {
            currentDate = new Date(date);
            document.querySelectorAll('.segment[data-view="year"]').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.segment[data-view="daily"]').forEach(b => b.classList.add('active'));
            document.getElementById('year-view').classList.remove('active');
            document.getElementById('daily-view').classList.add('active');
            currentView = 'daily';
            updateDateDisplay();
            renderEventList();
            loadState();
          });
          miniGrid.appendChild(cell);
          date.setDate(date.getDate() + 1);
        }

        monthCard.appendChild(header);
        monthCard.appendChild(miniGrid);
        grid.appendChild(monthCard);
      });
    }

    function renderDaily() {
      const container = document.getElementById('scheduleBlocks');
      if (container.children.length > 0) return;
      const blocks = ['8 AM', '9 AM', '10 AM', '11 AM', '12 PM', '1 PM', '2 PM', '3 PM', '4 PM', '5 PM', '6 PM', '7 PM'];
      blocks.forEach(block => {
        const timeLabel = document.createElement('div');
        timeLabel.className = 'time-slot';
        timeLabel.textContent = block;

        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'block-input';
        input.dataset.time = block;

        container.appendChild(timeLabel);
        container.appendChild(input);
      });
    }

    function updateDateDisplay() {
      document.getElementById('dateDisplay').textContent = currentDate.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
    }

    function getStorageKey() {
      return `${STORAGE_KEY}_${currentDate.toDateString()}`;
    }

    function loadState() {
      const raw = localStorage.getItem(getStorageKey());
      const state = raw ? JSON.parse(raw) : { textFields: {}, checkBoxes: {}, energy: null };

      document.querySelectorAll('input[type="text"], textarea').forEach(el => {
        const key = el.id || el.dataset.time;
        if (key && state.textFields[key] !== undefined) el.value = state.textFields[key];
      });

      document.querySelectorAll('.checkbox').forEach(box => {
        if (state.checkBoxes[box.dataset.id]) {
          box.classList.add('checked');
          const sibling = box.parentElement.querySelector('.task-input');
          if (sibling) sibling.classList.add('completed');
        }
      });

      const energyEls = document.querySelectorAll('.energy-btn');
      energyEls.forEach(btn => btn.classList.remove('active'));
      if (state.energy) {
        const active = document.querySelector(`.energy-btn[data-level="${state.energy}"]`);
        if (active) active.classList.add('active');
      }

      updateHabitProgress();
    }

    function saveState() {
      const state = { textFields: {}, checkBoxes: {}, energy: null };

      document.querySelectorAll('input[type="text"], textarea').forEach(el => {
        const key = el.id || el.dataset.time;
        if (key) state.textFields[key] = el.value;
      });

      document.querySelectorAll('.checkbox').forEach(box => {
        state.checkBoxes[box.dataset.id] = box.classList.contains('checked');
      });

      const activeEnergy = document.querySelector('.energy-btn.active');
      if (activeEnergy) state.energy = activeEnergy.dataset.level;

      localStorage.setItem(getStorageKey(), JSON.stringify(state));
    }

    function updateHabitProgress() {
      const boxes = document.querySelectorAll('.habit-check');
      let checked = 0;
      boxes.forEach(box => {
        if (box.classList.contains('checked')) checked++;
      });
      const total = boxes.length || 1;
      const fill = document.getElementById('habitProgressFill');
      const text = document.getElementById('habitProgressText');
      if (fill) fill.style.width = `${(checked / total) * 100}%`;
      if (text) text.textContent = `${checked}/${total}`;
    }

    init();
  </script>
</body>
</html>
