<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>ADHD Planner 2026-2027</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-cream: #FAF7F2;
      --card-bg: #FFFFFF;
      --border-soft: #EFE7DE;
      --text-main: #3C3836;
      --text-muted: #847C75;
      
      --pastel-pink: #F9E1E4;
      --pastel-pink-dark: #E4A8B2;
      --pastel-purple: #EFE4F7;
      --pastel-purple-dark: #B99FD1;
      --pastel-green: #E1EFEA;
      --pastel-green-dark: #91BAAB;
      --pastel-peach: #FDE8DD;
      --pastel-peach-dark: #E3B29B;
      --pastel-blue: #E2ECF7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-cream);
      font-family: 'Quicksand', sans-serif;
      color: var(--text-main);
      padding: 16px;
      display: flex;
      justify-content: center;
    }

    .planner-container {
      width: 100%;
      max-width: 1400px;
    }

    .planner-shell {
      background: var(--card-bg);
      border: 1px solid var(--border-soft);
      border-radius: 24px;
      box-shadow: 0 10px 35px rgba(100, 80, 70, 0.05);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-bottom: 20px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px dashed var(--border-soft);
      padding-bottom: 14px;
      flex-wrap: wrap;
      gap: 12px;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      letter-spacing: 0.02em;
      color: #383431;
    }

    .view-selector {
      display: flex;
      gap: 8px;
      background: var(--bg-cream);
      padding: 6px;
      border-radius: 99px;
    }

    .view-btn {
      border: none;
      background: transparent;
      padding: 8px 16px;
      border-radius: 99px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      color: var(--text-muted);
    }

    .view-btn.active {
      background: var(--card-bg);
      color: var(--text-main);
      box-shadow: 0 2px 8px rgba(100, 80, 70, 0.1);
    }

    .view-content {
      display: none;
    }

    .view-content.active {
      display: block;
    }

    /* Year at a Glance */
    .year-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
    }

    .month-card {
      background: var(--card-bg);
      border: 1px solid var(--border-soft);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 12px rgba(100, 80, 70, 0.08);
    }

    .month-header {
      padding: 12px 14px;
      font-weight: 700;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: white;
      text-align: center;
    }

    .month-header.nov { background: var(--pastel-pink); color: #8F515C; }
    .month-header.dec { background: var(--pastel-blue); color: #3D5A7C; }
    .month-header.jan { background: var(--pastel-purple); color: #6D5087; }
    .month-header.feb { background: var(--pastel-peach); color: #8C5C48; }
    .month-header.mar { background: var(--pastel-green); color: #4B7364; }
    .month-header.apr { background: var(--pastel-pink); color: #8F515C; }
    .month-header.may { background: var(--pastel-purple); color: #6D5087; }
    .month-header.jun { background: var(--pastel-peach); color: #8C5C48; }
    .month-header.jul { background: var(--pastel-green); color: #4B7364; }
    .month-header.aug { background: var(--pastel-pink); color: #8F515C; }
    .month-header.sep { background: var(--pastel-blue); color: #3D5A7C; }
    .month-header.oct { background: var(--pastel-purple); color: #6D5087; }

    .mini-calendar {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      padding: 10px;
      font-size: 0.7rem;
    }

    .mini-day-header {
      text-align: center;
      font-weight: 700;
      color: var(--text-muted);
      font-size: 0.65rem;
      margin-bottom: 4px;
    }

    .mini-day {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      background: var(--bg-cream);
      color: var(--text-main);
      cursor: pointer;
      transition: all 0.15s ease;
      font-weight: 600;
      font-size: 0.75rem;
    }

    .mini-day:hover {
      background: var(--pastel-pink);
    }

    .mini-day.other-month {
      color: var(--text-muted);
      opacity: 0.3;
    }

    .mini-day.today {
      background: var(--pastel-pink-dark);
      color: white;
      font-weight: 700;
    }

    /* Daily View */
    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    @media (max-width: 900px) {
      .dashboard-grid {
        grid-template-columns: 1fr;
      }
    }

    .column {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card {
      background: #FFFFFF;
      border-radius: 16px;
      border: 1px solid var(--border-soft);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .card-title {
      font-size: 0.82rem;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.08em;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: white;
    }

    .pink-header { background: var(--pastel-pink); color: #8F515C; }
    .purple-header { background: var(--pastel-purple); color: #6D5087; }
    .green-header { background: var(--pastel-green); color: #4B7364; }
    .peach-header { background: var(--pastel-peach); color: #8C5C48; }
    .blue-header { background: var(--pastel-blue); color: #3D5A7C; }

    .card-body {
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex-grow: 1;
    }

    textarea, input[type="text"] {
      width: 100%;
      border: 1px solid transparent;
      border-radius: 8px;
      background: var(--bg-cream);
      font-family: inherit;
      font-size: 0.92rem;
      padding: 10px;
      color: inherit;
      outline: none;
      transition: border-color 0.2s ease;
    }

    textarea:focus, input[type="text"]:focus {
      border-color: var(--pastel-pink-dark);
      background: #FFF;
    }

    .task-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .custom-check {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      border: 2px solid var(--pastel-purple-dark);
      background: #FFF;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.15s ease;
    }

    .custom-check.checked {
      background: var(--pastel-purple-dark);
      color: white;
    }

    .custom-check.checked::after {
      content: '✓';
      font-size: 13px;
      font-weight: 700;
    }

    .task-input {
      border: none;
      border-bottom: 1px dashed var(--border-soft);
      padding: 4px 2px;
      font-family: inherit;
      font-size: 0.92rem;
      width: 100%;
      background: transparent;
      outline: none;
    }

    .task-input.completed {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .progress-bar-wrap {
      width: 100%;
      height: 8px;
      background: var(--bg-cream);
      border-radius: 99px;
      overflow: hidden;
      margin-top: 4px;
    }

    .progress-fill {
      height: 100%;
      background: var(--pastel-green-dark);
      width: 0%;
      transition: width 0.3s ease;
    }

    .date-nav {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--bg-cream);
      padding: 8px 12px;
      border-radius: 99px;
    }

    .date-nav button {
      border: none;
      background: none;
      font-size: 1.1rem;
      cursor: pointer;
      padding: 4px 8px;
    }

    .date-nav span {
      font-size: 0.9rem;
      font-weight: 600;
      min-width: 150px;
      text-align: center;
    }

    .energy-picker {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-cream);
      padding: 6px 14px;
      border-radius: 99px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .energy-btn {
      border: none;
      background: none;
      font-size: 1.1rem;
      cursor: pointer;
      opacity: 0.35;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    .energy-btn.active {
      opacity: 1;
      transform: scale(1.25);
    }

    .schedule-grid {
      display: grid;
      grid-template-columns: 55px 1fr;
      gap: 6px;
      max-height: 380px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .time-slot {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text-muted);
      align-self: center;
    }

    .block-input {
      background: var(--bg-cream);
      border: none;
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 0.85rem;
      font-family: inherit;
      outline: none;
    }

    .block-input:focus {
      background: #FFFFFF;
      box-shadow: 0 0 0 1px var(--pastel-peach-dark);
    }

    .footer-actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 10px;
    }

    .btn-quiet {
      border: none;
      background: none;
      font-size: 0.8rem;
      color: var(--text-muted);
      cursor: pointer;
      text-decoration: underline;
    }

    .year-selector {
      display: flex;
      gap: 8px;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .year-selector button {
      border: 1px solid var(--border-soft);
      background: var(--card-bg);
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      color: var(--text-main);
    }

    .year-selector button.active {
      background: var(--pastel-pink);
      border-color: var(--pastel-pink-dark);
      color: #8F515C;
    }
  </style>
</head>
<body>

  <div class="planner-container">
    <div class="planner-shell">
      <header>
        <h1>ADHD Planner</h1>
        <div class="view-selector">
          <button class="view-btn active" data-view="year">Year Overview</button>
          <button class="view-btn" data-view="daily">Daily</button>
        </div>
      </header>

      <!-- YEAR AT A GLANCE -->
      <div class="view-content active" id="year-view">
        <div class="year-selector">
          <button class="year-btn active" data-year="2026">2026</button>
          <button class="year-btn" data-year="2027">2027</button>
        </div>
        <div class="year-grid" id="yearGrid"></div>
      </div>

      <!-- DAILY VIEW -->
      <div class="view-content" id="daily-view">
        <div style="display: flex; gap: 16px; flex-wrap: wrap; align-items: center;">
          <div class="date-nav">
            <button id="prevBtn">◀</button>
            <span id="dateDisplay">Today</span>
            <button id="nextBtn">▶</button>
          </div>
          <div class="energy-picker">
            <span>Energy:</span>
            <button class="energy-btn" data-level="low" title="Low Energy">🔋</button>
            <button class="energy-btn" data-level="med" title="Moderate Energy">⚡</button>
            <button class="energy-btn" data-level="high" title="Hyperfocus / High">✨</button>
          </div>
        </div>

        <div class="dashboard-grid">
          <div class="column">
            <div class="card">
              <div class="card-title pink-header">One Big Win</div>
              <div class="card-body">
                <textarea id="mainFocus" rows="2" placeholder="If I only accomplish one thing today..."></textarea>
              </div>
            </div>

            <div class="card">
              <div class="card-title purple-header">Essential 3</div>
              <div class="card-body">
                <div class="task-row">
                  <div class="custom-check" data-id="top1"></div>
                  <input type="text" class="task-input" id="top1-text" placeholder="Priority #1" />
                </div>
                <div class="task-row">
                  <div class="custom-check" data-id="top2"></div>
                  <input type="text" class="task-input" id="top2-text" placeholder="Priority #2" />
                </div>
                <div class="task-row">
                  <div class="custom-check" data-id="top3"></div>
                  <input type="text" class="task-input" id="top3-text" placeholder="Priority #3" />
                </div>
              </div>
            </div>

            <div class="card">
              <div class="card-title peach-header">Backlog</div>
              <div class="card-body">
                <div class="task-row">
                  <div class="custom-check" data-id="extra1"></div>
                  <input type="text" class="task-input" id="extra1-text" placeholder="If time permits..." />
                </div>
                <div class="task-row">
                  <div class="custom-check" data-id="extra2"></div>
                  <input type="text" class="task-input" id="extra2-text" placeholder="If time permits..." />
                </div>
                <div class="task-row">
                  <div class="custom-check" data-id="extra3"></div>
                  <input type="text" class="task-input" id="extra3-text" placeholder="If time permits..." />
                </div>
              </div>
            </div>
          </div>

          <div class="column">
            <div class="card" style="height: 100%;">
              <div class="card-title peach-header">Time Blocks</div>
              <div class="card-body">
                <div class="schedule-grid" id="scheduleBlocks"></div>
              </div>
            </div>
          </div>

          <div class="column">
            <div class="card">
              <div class="card-title green-header">
                <span>Dopamine Anchors</span>
                <span id="habitProgressText" style="font-size: 0.75rem; text-transform: none;">0/4</span>
              </div>
              <div class="card-body">
                <div class="progress-bar-wrap">
                  <div class="progress-fill" id="habitProgressFill"></div>
                </div>
                <div class="task-row" style="margin-top: 6px;">
                  <div class="custom-check habit-check" data-id="water"></div>
                  <span style="font-size: 0.88rem;">Hydrate</span>
                </div>
                <div class="task-row">
                  <div class="custom-check habit-check" data-id="movement"></div>
                  <span style="font-size: 0.88rem;">Sunlight / Walk</span>
                </div>
                <div class="task-row">
                  <div class="custom-check habit-check" data-id="meds"></div>
                  <span style="font-size: 0.88rem;">Meds</span>
                </div>
                <div class="task-row">
                  <div class="custom-check habit-check" data-id="reset"></div>
                  <span style="font-size: 0.88rem;">Desk Reset</span>
                </div>
              </div>
            </div>

            <div class="card" style="flex-grow: 1;">
              <div class="card-title purple-header">Brain Dump</div>
              <div class="card-body">
                <textarea id="brainDump" style="height: 100%; min-height: 140px;" placeholder="Get thoughts out..."></textarea>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="footer-actions" style="padding: 0 24px;">
      <button class="btn-quiet" id="resetTodayBtn">Clear Checks</button>
      <button class="btn-quiet" id="clearAllBtn" style="color: #c97d7d;">Reset</button>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'adhd_planner_v3';
    let currentView = 'year';
    let currentDate = new Date();
    let selectedYear = 2026;

    // Months data
    const monthsData = [
      { name: 'November', short: 'nov', year: 2026, start: new Date(2026, 10, 1), end: new Date(2026, 10, 30) },
      { name: 'December', short: 'dec', year: 2026, start: new Date(2026, 11, 1), end: new Date(2026, 11, 31) },
      { name: 'January', short: 'jan', year: 2027, start: new Date(2027, 0, 1), end: new Date(2027, 0, 31) },
      { name: 'February', short: 'feb', year: 2027, start: new Date(2027, 1, 1), end: new Date(2027, 1, 28) },
      { name: 'March', short: 'mar', year: 2027, start: new Date(2027, 2, 1), end: new Date(2027, 2, 31) },
      { name: 'April', short: 'apr', year: 2027, start: new Date(2027, 3, 1), end: new Date(2027, 3, 30) },
      { name: 'May', short: 'may', year: 2027, start: new Date(2027, 4, 1), end: new Date(2027, 4, 31) },
      { name: 'June', short: 'jun', year: 2027, start: new Date(2027, 5, 1), end: new Date(2027, 5, 30) },
      { name: 'July', short: 'jul', year: 2027, start: new Date(2027, 6, 1), end: new Date(2027, 6, 31) },
      { name: 'August', short: 'aug', year: 2027, start: new Date(2027, 7, 1), end: new Date(2027, 7, 31) },
      { name: 'September', short: 'sep', year: 2027, start: new Date(2027, 8, 1), end: new Date(2027, 8, 30) },
      { name: 'October', short: 'oct', year: 2027, start: new Date(2027, 9, 1), end: new Date(2027, 9, 31) },
      { name: 'November', short: 'nov', year: 2027, start: new Date(2027, 10, 1), end: new Date(2027, 10, 30) },
      { name: 'December', short: 'dec', year: 2027, start: new Date(2027, 11, 1), end: new Date(2027, 11, 31) }
    ];

    function init() {
      renderYearOverview();
      setupEventListeners();
      loadState();
    }

    // View Switching
    document.querySelectorAll('.view-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.view-content').forEach(v => v.classList.remove('active'));
        btn.classList.add('active');
        currentView = btn.dataset.view;
        document.getElementById(`${currentView}-view`).classList.add('active');
        if (currentView === 'daily') {
          renderDaily();
          updateDateDisplay();
        }
      });
    });

    // Year Selector
    document.querySelectorAll('.year-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.year-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedYear = parseInt(btn.dataset.year);
        renderYearOverview();
      });
    });

    function renderYearOverview() {
      const yearGrid = document.getElementById('yearGrid');
      yearGrid.innerHTML = '';

      const monthsForYear = monthsData.filter(m => m.year === selectedYear);

      monthsForYear.forEach(month => {
        const card = document.createElement('div');
        card.className = 'month-card';

        const header = document.createElement('div');
        header.className = `month-header ${month.short}`;
        header.innerText = `${month.name} ${month.year}`;

        const calendar = document.createElement('div');
        calendar.className = 'mini-calendar';

        // Day headers
        const dayLabels = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
        dayLabels.forEach(day => {
          const label = document.createElement('div');
          label.className = 'mini-day-header';
          label.innerText = day;
          calendar.appendChild(label);
        });

        // Get first day and number of days
        const firstDay = new Date(month.year, month.start.getMonth(), 1);
        const startDate = new Date(firstDay);
        startDate.setDate(startDate.getDate() - firstDay.getDay());

        let date = new Date(startDate);
        for (let i = 0; i < 35; i++) {
          const dayEl = document.createElement('div');
          dayEl.className = 'mini-day';

          if (date.getMonth() !== month.start.getMonth()) {
            dayEl.classList.add('other-month');
          }

          if (date.toDateString() === new Date().toDateString()) {
            dayEl.classList.add('today');
          }

          dayEl.innerText = date.getDate();
          dayEl.addEventListener('click', () => {
            currentDate = new Date(date);
            document.querySelectorAll('.view-btn[data-view="daily"]')[0].click();
          });

          calendar.appendChild(dayEl);
          date.setDate(date.getDate() + 1);
        }

        card.appendChild(header);
        card.appendChild(calendar);
        yearGrid.appendChild(card);
      });
    }

    function renderDaily() {
      const scheduleContainer = document.getElementById('scheduleBlocks');
      if (scheduleContainer.children.length === 0) {
        const hours = ['8 AM', '9 AM', '10 AM', '11 AM', '12 PM', '1 PM', '2 PM', '3 PM', '4 PM', '5 PM', '6 PM', '7 PM'];
        hours.forEach(time => {
          const timeLabel = document.createElement('div');
          timeLabel.className = 'time-slot';
          timeLabel.innerText = time;

          const input = document.createElement('input');
          input.type = 'text';
          input.className = 'block-input';
          input.dataset.time = time;

          scheduleContainer.appendChild(timeLabel);
          scheduleContainer.appendChild(input);
        });
      }
    }

    function updateDateDisplay() {
      const display = document.getElementById('dateDisplay');
      display.innerText = currentDate.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
    }

    document.getElementById('prevBtn')?.addEventListener('click', () => {
      currentDate.setDate(currentDate.getDate() - 1);
      updateDateDisplay();
      loadState();
    });

    document.getElementById('nextBtn')?.addEventListener('click', () => {
      currentDate.setDate(currentDate.getDate() + 1);
      updateDateDisplay();
      loadState();
    });

    function getStorageKey() {
      return `${STORAGE_KEY}_${currentDate.toDateString()}`;
    }

    function loadState() {
      const raw = localStorage.getItem(getStorageKey());
      const state = raw ? JSON.parse(raw) : { textFields: {}, checkBoxes: {}, energy: null };

      document.querySelectorAll('input[type="text"], textarea').forEach(el => {
        const key = el.id || el.dataset.time;
        if (key && state.textFields[key]) {
          el.value = state.textFields[key];
        }
      });

      document.querySelectorAll('.custom-check').forEach(box => {
        if (state.checkBoxes[box.dataset.id]) {
          box.classList.add('checked');
          const siblingInput = box.parentElement.querySelector('.task-input');
          if (siblingInput) siblingInput.classList.add('completed');
        }
      });

      if (state.energy) {
        document.querySelector(`[data-level="${state.energy}"]`)?.classList.add('active');
      }

      updateHabitProgress();
    }

    function saveState() {
      const state = { textFields: {}, checkBoxes: {}, energy: null };

      document.querySelectorAll('input[type="text"], textarea').forEach(el => {
        const key = el.id || el.dataset.time;
        if (key) state.textFields[key] = el.value;
      });

      document.querySelectorAll('.custom-check').forEach(box => {
        state.checkBoxes[box.dataset.id] = box.classList.contains('checked');
      });

      const activeEnergy = document.querySelector('.energy-btn.active');
      if (activeEnergy) state.energy = activeEnergy.dataset.level;

      localStorage.setItem(getStorageKey(), JSON.stringify(state));
    }

    function setupEventListeners() {
      document.querySelectorAll('input[type="text"], textarea').forEach(el => {
        el.addEventListener('input', saveState);
      });

      document.querySelectorAll('.custom-check').forEach(box => {
        box.addEventListener('click', () => {
          const isChecked = box.classList.toggle('checked');
          const siblingInput = box.parentElement.querySelector('.task-input');
          if (siblingInput) siblingInput.classList.toggle('completed', isChecked);
          saveState();
          updateHabitProgress();
        });
      });

      document.querySelectorAll('.energy-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.energy-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          saveState();
        });
      });

      document.getElementById('resetTodayBtn').addEventListener('click', () => {
        document.querySelectorAll('.custom-check').forEach(b => {
          b.classList.remove('checked');
          const sibling = b.parentElement.querySelector('.task-input');
          if (sibling) sibling.classList.remove('completed');
        });
        saveState();
        updateHabitProgress();
      });

      document.getElementById('clearAllBtn').addEventListener('click', () => {
        if (confirm('Clear all data for today?')) {
          localStorage.removeItem(getStorageKey());
          location.reload();
        }
      });
    }

    function updateHabitProgress() {
      const habitBoxes = document.querySelectorAll('.habit-check');
      const total = habitBoxes.length;
      let checked = 0;
      habitBoxes.forEach(b => {
        if (b.classList.contains('checked')) checked++;
      });
      const progressText = document.getElementById('habitProgressText');
      if (progressText) {
        progressText.innerText = `${checked}/${total}`;
        document.getElementById('habitProgressFill').style.width = `${(checked / total) * 100}%`;
      }
    }

    init();
  </script>
</body>
</html>
